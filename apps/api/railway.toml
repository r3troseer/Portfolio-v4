# Railway config-as-code for the portfolio API.
#
# Dashboard wiring (not encoded here - see docs/deployment/layer1-runtime.md):
# - Root Directory: / (monorepo root so Layer 0 content is present for the index build)
# - Config file path: /apps/api/railway.toml
# - Wait for CI: enabled (gates on .github/workflows/ci.yml)
# - Branch -> environment: dev -> staging/dev, main -> production
#
# Companions at repo root:
# - mise.toml / railpack.json install python + uv for Railpack (root has no
#   pyproject.toml, so the Python provider would not autodetect otherwise).
#
# No migrate / preDeployCommand: this backend is DB-less.

[build]
builder = "RAILPACK"
# Run from monorepo root (Root Directory /). Sync API deps, then write the
# gitignored evidence index artifact under apps/api/var/.
buildCommand = "cd apps/api && uv sync --locked && uv run python manage.py build_evidence_index"
watchPatterns = [
  "/apps/api/**",
  "/apps/web/src/content/public/**",
]

[deploy]
# Use uv run gunicorn with preDeployCommand to install venv at runtime.
# The preDeployCommand runs uv sync --locked in the runtime container,
# creating .venv with all dependencies. Then startCommand uses uv run to
# launch gunicorn, which is available because uv is in railpack.json packages.
preDeployCommand = "cd apps/api && uv sync --locked"
startCommand = "cd apps/api && uv run gunicorn --bind 0.0.0.0:${PORT:-8000} config.wsgi:application"
healthcheckPath = "/health/"
restartPolicyType = "ON_FAILURE"

