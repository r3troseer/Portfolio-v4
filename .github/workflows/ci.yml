name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Node.js major pinned in apps/web/package.json.
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
        env:
          # Public build config, not a secret. Production uses the Railway origin.
          VITE_API_BASE_URL: https://api.example.invalid

  api:
    name: API check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Ephemeral CI-only key satisfying production startup policy (B-07); not a deploy secret.
      DJANGO_SECRET_KEY: ci-ephemeral-test-django-secret-key-not-for-production-use-0001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Production settings check
        run: uv run python manage.py check
        env:
          DJANGO_DEBUG: "false"
      # Layer 1 evidence-index gating: fails on any governance error
      # (checkout is the full monorepo, so ../web content is present).
      - run: uv run python manage.py build_evidence_index --check
      - run: uv run python manage.py test core
